<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
        (function() {
            var t = localStorage.getItem('theme') || 'light';
            if (t === 'dark') document.documentElement.classList.add('dark');
        })();
    </script>
    <title>{{.title}}</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/fa/icons.css">
    <link rel="stylesheet" href="/static/vendor/css/leaflet.css">
    <script src="/static/vendor/js/jquery.js"></script>
    <script src="/static/vendor/js/leaflet.js"></script>
    <script src="/static/js/utils.js" defer></script>
    <script src="/static/js/progress.js" defer></script>
    <script src="/static/js/directory-browser.js" defer></script>
    <script src="/static/js/app.js" defer></script>
</head>
<body>
    {{.body}}
    <template id="photo-group-template">
        <div class="timeline-group">
            <div class="timeline-group-header">
                <div class="timeline-group-meta">
                    <button type="button" class="timeline-group-title"></button>
                    <a href="#" class="timeline-group-jump" hidden></a>
                </div>
                <div class="timeline-group-count"></div>
            </div>
            <div class="thumb-grid"></div>
        </div>
    </template>
    <template id="photo-template">
        <div class="thumb photo-card">
            <img class="thumb-image" loading="lazy" alt="" hidden>
            <div class="thumb-status-dots" aria-hidden="true">
                <span class="thumb-status-dot dot-unsaved" title="Unsaved changes"></span>
                <span class="thumb-status-dot dot-missing-gps" title="Missing GPS"></span>
                <span class="thumb-status-dot dot-missing-gps-time" title="Missing GPS time"></span>
            </div>
            <span class="thumb-gps-adjusted">GPS adjusted</span>
            <span class="thumb-title"></span>
        </div>
    </template>
</body>
</html>
